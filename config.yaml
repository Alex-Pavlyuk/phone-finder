# ── Что ищем ──────────────────────────────────────────────────────────────────
# Критерии применяются локально, по характеристикам из карточек товара: фильтры
# магазинов по зуму и стабилизации либо отсутствуют, либо закодированы
# внутренними id параметров, которые меняются вместе с вёрсткой.
#
# Исключение — battery_mah_min: у Allegro фильтр по ёмкости аккумулятора есть,
# и он подставляется в поисковый URL. Так его страницы выдачи — это сразу
# телефоны с нужной батареей, а не общий поток.
#
# Осторожно с battery_mah_min: даже 7500 мАч вместе с IP68 и телеобъективом —
# это считанные модели (силикон-углеродные батареи такой ёмкости обычно ставят
# в аппараты без перископа). Если в основной вкладке пусто, смотрите «Почти»:
# near_miss.battery_slack_mah как раз для этого и задан.

criteria:
  battery_mah_min: 7500     # мАч — порог для основной вкладки
  # Абсолютный минимум: модель с меньшей батареей не показывается вообще, ни в
  # «Почти», ни где-либо ещё, какими бы ни были допуски ниже. Правило сильнее
  # near_miss.battery_slack_mah — на случай, если порог выше когда-то снизится.
  battery_mah_floor: 7000
  optical_zoom_min: 3       # кратность ОПТИЧЕСКОГО зума (цифровой не считается)
  ois_required: true        # оптическая стабилизация основной камеры
  ip_min: IP68              # IP68 | IP69 | IP69K
  ai_required: true         # AI-сервисы на борту (Galaxy AI, Gemini, Apple Intelligence…)
  price_max: 7000           # PLN, 0 = без ограничения
  price_min: 900            # отсекает аксессуары, попавшие в категорию
  exclude_used: true        # только новые (на Allegro половина выдачи — б/у)

# Near-miss: модели, провалившиеся ТОЛЬКО по мягкому допуску или по
# неизвестной характеристике. Попадают в отдельную вкладку отчёта.
#
# allow_unknown_* решает, что делать с характеристикой, которой магазин не
# указал. Для батареи, IP и AI это «в Почти»: у только что вышедшей модели
# таблица заполнена хуже всего, и жёсткий отказ прятал бы ровно те новинки,
# ради которых всё это работает.
#
# Для оптики — наоборот, жёсткий отказ: камера с OIS и зумом здесь главный
# критерий, и телефон, про который магазин этого не написал, предлагать не
# нужно вообще. Практически это выбрасывает защищённые «кирпичи» (у них третий
# модуль — ноктовизор, а не телеобъектив) и дешёвые модели без телеобъектива.
near_miss:
  enabled: true
  battery_slack_mah: 1500   # батарея до 1500 мАч меньше минимума (то есть до 6000)
  zoom_slack_x: 1           # зум на 1× меньше минимума
  price_overshoot_pct: 15   # цена до +15% сверх бюджета
  allow_unknown_battery: true
  allow_unknown_zoom: false
  allow_unknown_ois: false
  allow_unknown_ip: true
  allow_unknown_ai: true

# ── AI-сервисы ────────────────────────────────────────────────────────────────
# Магазины про AI почти не пишут (исключение — Morele с «Funkcje AI»), поэтому
# кроме прямых упоминаний в карточке работают правила по названию модели.
# Ключ — регулярное выражение по «марка модель», значение — название сервиса.
ai_rules:
  "galaxy (s\\d|z (fold|flip)|a[5-9]\\d|note)": Galaxy AI
  "pixel \\d": Gemini Nano
  "iphone (1[6-9]|2\\d)": Apple Intelligence
  "iphone 15 pro": Apple Intelligence
  "(xiaomi|redmi|poco) ": HyperOS AI
  "^honor|honor ": MagicOS AI
  "(motorola|moto) ": Moto AI
  "(oneplus|oppo|realme|vivo) ": AI
  "nothing phone": Essential Space

# ── Скоринг ───────────────────────────────────────────────────────────────────
scoring:
  base: 40

  zoom_per_x: 7             # за каждую кратность сверх минимума
  zoom_cap: 28
  battery_per_1000_mah: 5   # за каждую 1000 мАч сверх минимума
  battery_cap: 20
  ois_bonus: 5
  ip69k_bonus: 5            # IP69K — защита ещё и от струи горячей воды
  ai_bonus: 6

  # Телеобъектив важнее основного модуля: именно им снимают на зуме
  tele_mp_bonus:            # порог Mpix -> баллы (первый подходящий сверху вниз)
    - [48, 12]
    - [12, 8]
    - [8, 4]
  main_mp_bonus:
    - [100, 8]
    - [50, 5]
    - [12, 2]

  price_margin_weight: 10   # чем дешевле относительно потолка, тем больше баллов
  store_bonus: 2            # за каждый магазин сверх первого
  store_cap: 6
  unknown_penalty: 4        # за каждую неизвестную ключевую характеристику

  brand_bonus:
    samsung: 4
    google: 4
    apple: 3
    honor: 2
    xiaomi: 2
    motorola: 1

# ── Характеристики ────────────────────────────────────────────────────────────
# Карточка товара открывается один раз на модель, дальше берётся из кеша.
# Лимит на прогон нужен, чтобы первый запуск не превратился в тысячу запросов:
# ассортимент разбирается за несколько прогонов, а новинки — сразу, они в
# очереди первые.
specs:
  max_pages_per_run: 80     # карточек товара за прогон
  max_pages_per_model: 2    # сколько магазинов опрашивать по одной модели
  recheck_after_days: 60    # перепроверять неполные таблицы характеристик
  # Поиск карточки по названию — для моделей, которых нет ни в одной нашей
  # выдаче. Типичный случай: телефон с большой батареей виден на Allegro (там
  # есть фильтр по ёмкости), а в первых страницах категории x-kom его нет.
  max_lookups_per_run: 20
  # Если модели нет ни в x-kom, ни в Morele, её карточка ищется в GSMArena по
  # странице марки (новые устройства сверху); столько страниц марки читать.
  gsm_brand_pages: 3
  # Модель, которой нет ни в x-kom, ни в Morele, повторно ищется не раньше чем
  # через столько дней: иначе безнадёжные «кирпичи» съедали бы лимит поиска
  # каждый прогон, и до остальных очередь не доходила бы никогда.
  retry_lookup_after_days: 14

# ── Вкладка «Скоро»: телефоны, которых ещё нет в продаже ──────────────────────
# Критерии те же, но с поправкой на природу источника: у слуха характеристики
# почти всегда неполные, и жёсткий отказ за «OIS не подтверждён» оставил бы
# вкладку пустой. Поэтому здесь неизвестность модель не выбрасывает — только
# прямое противоречие (названная батарея меньше требуемой, IP67 вместо IP68).
upcoming:
  enabled: true
  window_days: 75          # «в ближайшие пару месяцев»
  max_devices: 20          # карточек GSMArena за прогон
  articles_per_feed: 40
  recheck_after_days: 7    # слух мог обрасти подробностями — перечитать
  require_date: false      # прятать модели без названного срока
  require_signal: true     # показывать только те слухи, где назван срок или
                           # хотя бы одна характеристика из критериев

  # Ленты новостных сайтов. Проверено: эти отдают RSS без антибот-проверки.
  # PhoneArena (403 Cloudflare), 91mobiles, Telepolis и Komórkomania отдают
  # либо проверку, либо 404 — поэтому их здесь нет.
  feeds:
    gsmarena: https://www.gsmarena.com/rss-news-reviews.php3
    gizmochina: https://www.gizmochina.com/feed/
    androidauthority: https://www.androidauthority.com/feed/
    androidheadlines: https://www.androidheadlines.com/feed
    sammobile: https://www.sammobile.com/feed/
    xda: https://www.xda-developers.com/feed/
    tabletowo: https://www.tabletowo.pl/feed/

# ── Вкладка «AliExpress» ──────────────────────────────────────────────────────
# Отдельная вкладка, потому что характеристики здесь — слова продавца, а не
# таблица магазина; смешивать их с магазинной выдачей и рейтингом нельзя.
# Год обязателен в заголовке товара: «2026» на AliExpress часть названия, и это
# единственный признак свежести. Если модель есть в кеше характеристик (её
# продаёт кто-то в Польше), берутся магазинные данные, а не обещания продавца.
aliexpress:
  enabled: true
  year: 2026
  price_overshoot_pct: 20   # с Китая цена ниже, но пошлина и доставка сверху
  spec_recheck_days: 60
  queries:                  # каждый запрос — одна страница выдачи (60 товаров)
    - smartphone 2026
    - smartphone 2026 8000mAh
    - rugged smartphone 2026
    - smartphone 2026 telephoto

# ── Уведомления macOS ─────────────────────────────────────────────────────────
notify:
  enabled: true
  min_score: 55    # ниже — не беспокоить, иначе уведомления превращаются в шум
  max_per_run: 5

# ── Магазины ──────────────────────────────────────────────────────────────────
# max_pages: страниц выдачи за прогон. Полностью категорию вычерпывать не нужно
# — новинки в выдаче наверху, а характеристики моделей уже в кеше.
#
# mediaexpert.pl и euro.com.pl (RTV Euro AGD) напрямую сюда не входят: оба
# отдают 403 на любой запрос без прохождения их антибот-проверки. Зато их цены
# видит Ceneo — он сравнивает магазины и отдаёт минимальную цену по рынку.
sources:
  ceneo:
    enabled: true
    max_pages: 4        # ~43 товара на страницу. Больше — риск заглушки, см. README
  allegro:
    enabled: true
    max_pages: 3        # ~60 предложений на страницу. Больше — риск 429, см. README
  xkom:
    enabled: true
    max_pages: 6        # ~54 товара на страницу
  morele:
    enabled: true
    max_pages: 6        # 30 товаров на страницу
  mediamarkt:
    enabled: true
    max_pages: 6        # ~30 товаров на страницу
  komputronik:
    enabled: true
    max_pages: 6        # 20 товаров на страницу

# ── Прочее ────────────────────────────────────────────────────────────────────
runtime:
  request_delay_sec: 1.2   # пауза между запросами к ОДНОМУ магазину
  host_delay_sec:          # исключения: тут считают запросы жёстче остальных
    allegro.pl: 10         # иначе 429
    ceneo.pl: 10           # иначе заглушка «Przejdź do Ceneo» вместо выдачи
  timeout_sec: 40
  retries: 3
  stale_after_days: 30     # модель, не встреченная дольше — помечается «пропала»

# ── Приложение в строке меню ───────────────────────────────────────────────────
app:
  interval_minutes: 90     # телефоны выходят не каждый час, чаще смысла нет
